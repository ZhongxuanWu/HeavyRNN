[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heavyrnn"
version = "0.1.0"
description = "A lightweight, batched reimplementation of the flagship heavy-tailed RNN experiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "omegaconf>=2.3",
    "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
heavyrnn = "heavyrnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "cuda: tests that require a CUDA-capable PyTorch installation and GPU",
]
